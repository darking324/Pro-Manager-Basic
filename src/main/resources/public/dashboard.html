<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Project Board | ProManageBasic</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-container-highest": "#2d3449", "on-primary-fixed": "#001a42",
          "on-tertiary": "#003824", "error": "#ffb4ab", "outline": "#8c909f",
          "on-error": "#690005", "surface-variant": "#2d3449", "tertiary": "#4edea3",
          "inverse-primary": "#005ac2", "inverse-on-surface": "#283044",
          "error-container": "#93000a", "on-primary": "#002e6a",
          "on-tertiary-container": "#00311f", "surface-container-low": "#131b2e",
          "surface-tint": "#adc6ff", "on-surface": "#dae2fd",
          "on-primary-container": "#00285d", "on-tertiary-fixed": "#002113",
          "on-secondary": "#182f59", "on-secondary-fixed": "#001a42",
          "surface-container-lowest": "#060e20", "surface-container": "#171f33",
          "on-secondary-fixed-variant": "#304671", "on-error-container": "#ffdad6",
          "primary": "#adc6ff", "on-tertiary-fixed-variant": "#005236",
          "on-surface-variant": "#c2c6d6", "inverse-surface": "#dae2fd",
          "on-background": "#dae2fd", "primary-container": "#4d8eff",
          "primary-fixed-dim": "#adc6ff", "primary-fixed": "#d8e2ff",
          "tertiary-fixed-dim": "#4edea3", "secondary-container": "#304671",
          "outline-variant": "#424754", "on-primary-fixed-variant": "#004395",
          "secondary-fixed": "#d8e2ff", "secondary-fixed-dim": "#b1c6f9",
          "tertiary-fixed": "#6ffbbe", "tertiary-container": "#00a572",
          "surface-dim": "#0b1326", "surface-bright": "#31394d",
          "secondary": "#b1c6f9", "background": "#0b1326", "surface": "#0b1326",
          "surface-container-high": "#222a3d", "on-secondary-container": "#9fb5e7"
        },
        "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
        "fontFamily": { "headline": ["Inter"], "body": ["Inter"], "label": ["Inter"] }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .glass-panel { background: rgba(19, 27, 46, 0.7); backdrop-filter: blur(20px); }
  .kanban-column { min-width: 320px; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2d3449; border-radius: 10px; }
  .task-card { transition: all 0.2s ease; }
  .task-card.dragging { opacity: 0.5; transform: scale(0.95); }
  .kanban-column.drag-over { background: rgba(173, 198, 255, 0.05); border-radius: 0.5rem; }
  /* Modal */
  #task-modal { display: none; }
  #task-modal.open { display: flex; }
  .toast { transition: opacity 0.3s ease; }
</style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden">

<!-- Side Nav -->
<aside class="h-screen w-64 fixed left-0 top-0 z-50 bg-slate-900/70 backdrop-blur-xl flex flex-col py-8 px-4 gap-y-6 shadow-2xl shadow-slate-950/50">
  <div class="flex flex-col gap-1 px-2">
    <span class="text-xl font-black text-slate-50 tracking-tighter">ProManage</span>
    <span class="font-inter tracking-tight text-sm text-blue-400">Enterprise Tier</span>
  </div>
  <nav class="flex-1 flex flex-col gap-2 mt-4">
    <a class="flex items-center gap-3 px-4 py-3 text-blue-400 font-semibold bg-slate-800/40 rounded-lg transition-transform" href="#">
      <span class="material-symbols-outlined">dashboard</span><span class="text-sm">Board</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-100 hover:bg-slate-800/50 transition-colors duration-200" href="#">
      <span class="material-symbols-outlined">analytics</span><span class="text-sm">Analytics</span>
    </a>
    <a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-slate-100 hover:bg-slate-800/50 transition-colors duration-200" href="#">
      <span class="material-symbols-outlined">group</span><span class="text-sm">Team</span>
    </a>
    <a id="logout-btn" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-red-400 hover:bg-slate-800/50 transition-colors duration-200 cursor-pointer mt-auto" href="#">
      <span class="material-symbols-outlined">logout</span><span class="text-sm">Logout</span>
    </a>
  </nav>
  <div class="px-2">
    <button id="new-task-btn" class="w-full py-3 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-lg shadow-primary/20 transition-transform active:scale-95">
      + New Task
    </button>
  </div>
</aside>

<!-- Top Nav -->
<header class="fixed top-0 right-0 left-64 h-16 z-40 bg-slate-950/50 backdrop-blur-md flex justify-between items-center px-8 border-b border-slate-800/15">
  <div class="flex items-center flex-1 max-w-xl">
    <div class="relative w-full">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-lg">search</span>
      <input id="search-input" class="w-full bg-surface-container-highest/50 border-none rounded-full pl-10 pr-4 py-2 text-sm focus:ring-1 focus:ring-primary placeholder-on-surface-variant/50" placeholder="Search tasks..." type="text"/>
    </div>
  </div>
  <div class="flex items-center gap-6">
    <button class="relative opacity-80 hover:opacity-100">
      <span class="material-symbols-outlined text-on-surface">notifications</span>
      <span class="absolute top-0 right-0 w-2 h-2 bg-tertiary rounded-full"></span>
    </button>
    <div class="flex items-center gap-3">
      <div class="text-right">
        <p id="user-name" class="text-xs font-bold text-on-surface">Loading...</p>
        <p class="text-[10px] text-on-surface-variant uppercase tracking-widest">Lead Manager</p>
      </div>
      <div class="w-8 h-8 rounded-full border border-outline-variant/30 bg-primary/20 flex items-center justify-center text-primary font-bold text-sm" id="user-avatar">?</div>
    </div>
  </div>
</header>

<!-- Main Canvas -->
<main class="fixed inset-0 left-64 top-16 overflow-y-auto bg-surface-container-lowest p-8">
  <!-- Header + Revenue Widget -->
  <section class="flex flex-col md:flex-row gap-6 mb-12">
    <div class="flex-1">
      <h1 class="text-4xl font-black text-on-surface tracking-tighter mb-2">Project Board</h1>
      <p class="text-on-surface-variant font-medium">Enterprise Pipeline • Live Sprint</p>
    </div>
    <!-- Live Revenue Widget -->
    <div class="glass-panel p-6 rounded-xl border border-outline-variant/10 shadow-2xl flex items-center gap-8">
      <div>
        <p class="text-[10px] font-bold text-tertiary uppercase tracking-[0.2em] mb-1">Live Revenue Forecast</p>
        <div class="flex items-baseline gap-2">
          <span id="total-revenue" class="text-3xl font-black text-on-surface">$—</span>
          <span class="text-tertiary text-sm font-bold flex items-center">
            <span class="material-symbols-outlined text-sm">trending_up</span>
            <span id="due-soon-count">—</span> due soon
          </span>
        </div>
        <div class="flex gap-4 mt-2 text-xs text-on-surface-variant">
          <span>Todo: <strong id="stat-todo" class="text-primary">—</strong></span>
          <span>Active: <strong id="stat-inprog" class="text-tertiary">—</strong></span>
          <span>Done: <strong id="stat-done" class="text-on-surface-variant">—</strong></span>
        </div>
      </div>
      <div id="revenue-bars" class="h-12 w-32 flex items-end gap-1">
        <div class="w-2 bg-tertiary/20 h-4 rounded-t-sm"></div>
        <div class="w-2 bg-tertiary/40 h-8 rounded-t-sm"></div>
        <div class="w-2 bg-tertiary/60 h-6 rounded-t-sm"></div>
        <div class="w-2 bg-tertiary/80 h-10 rounded-t-sm"></div>
        <div class="w-2 bg-tertiary h-12 rounded-t-sm"></div>
      </div>
    </div>
  </section>

  <!-- Filters -->
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mr-2">Filter</span>
      <button data-filter="high" class="filter-btn px-4 py-1.5 rounded-full bg-surface-container-high text-xs font-semibold text-error/80 border border-error/20 hover:bg-error/10 transition-colors">High Priority</button>
      <button data-filter="medium" class="filter-btn px-4 py-1.5 rounded-full bg-surface-container-high text-xs font-semibold text-primary/80 border border-primary/20 hover:bg-primary/10 transition-colors">Medium</button>
      <button data-filter="low" class="filter-btn px-4 py-1.5 rounded-full bg-surface-container-high text-xs font-semibold text-on-surface-variant border border-outline-variant/20 hover:bg-surface-variant transition-colors">Low</button>
      <button data-filter="" class="filter-btn px-4 py-1.5 rounded-full bg-surface-container-high text-xs font-semibold text-on-surface-variant border border-outline-variant/20 hover:bg-surface-variant transition-colors">All</button>
    </div>
    <button id="open-create-btn" class="flex items-center gap-2 px-6 py-2.5 bg-surface-container-highest rounded-xl text-sm font-bold text-on-surface border border-outline-variant/30 hover:border-primary/50 transition-all group">
      <span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">add_circle</span>
      New Task
    </button>
  </div>

  <!-- Kanban Board -->
  <div class="flex gap-8 overflow-x-auto pb-8">
    <!-- To Do Column -->
    <div class="kanban-column flex flex-col gap-4" data-status="todo" id="col-todo">
      <div class="flex items-center justify-between px-2 mb-2">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-primary-container"></div>
          <h3 class="text-sm font-black uppercase tracking-widest text-on-surface">To Do</h3>
        </div>
        <span id="count-todo" class="bg-surface-container-high px-2 py-0.5 rounded text-[10px] font-bold text-on-surface-variant">0</span>
      </div>
      <div id="tasks-todo" class="flex flex-col gap-4 min-h-[120px]"></div>
    </div>
    <!-- In Progress Column -->
    <div class="kanban-column flex flex-col gap-4" data-status="in_progress" id="col-inprogress">
      <div class="flex items-center justify-between px-2 mb-2">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-tertiary"></div>
          <h3 class="text-sm font-black uppercase tracking-widest text-on-surface">In Progress</h3>
        </div>
        <span id="count-inprogress" class="bg-surface-container-high px-2 py-0.5 rounded text-[10px] font-bold text-on-surface-variant">0</span>
      </div>
      <div id="tasks-inprogress" class="flex flex-col gap-4 min-h-[120px]"></div>
    </div>
    <!-- Done Column -->
    <div class="kanban-column flex flex-col gap-4" data-status="completed" id="col-done">
      <div class="flex items-center justify-between px-2 mb-2">
        <div class="flex items-center gap-2">
          <div class="w-2 h-2 rounded-full bg-on-surface-variant"></div>
          <h3 class="text-sm font-black uppercase tracking-widest text-on-surface">Done</h3>
        </div>
        <span id="count-done" class="bg-surface-container-high px-2 py-0.5 rounded text-[10px] font-bold text-on-surface-variant">0</span>
      </div>
      <div id="tasks-done" class="flex flex-col gap-4 min-h-[120px]"></div>
    </div>
  </div>
</main>

<!-- Visual Accents -->
<div class="fixed bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none z-0"></div>
<div class="fixed top-[20%] left-[-5%] w-[300px] h-[300px] bg-tertiary/5 rounded-full blur-[100px] pointer-events-none z-0"></div>

<!-- Create/Edit Task Modal -->
<div id="task-modal" class="fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm">
  <div class="bg-surface-container w-full max-w-lg rounded-xl p-8 shadow-2xl border border-outline-variant/20">
    <div class="flex justify-between items-center mb-6">
      <h2 id="modal-title" class="text-xl font-black text-on-surface">New Task</h2>
      <button id="close-modal" class="text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="task-form" class="space-y-4">
      <input type="hidden" id="task-id"/>
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Title *</label>
        <input id="task-title" type="text" required placeholder="e.g. Implement Stripe Connect" class="w-full bg-surface-container-highest/50 border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface text-sm focus:ring-1 focus:ring-primary placeholder-on-surface-variant/40"/>
      </div>
      <div>
        <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Description</label>
        <textarea id="task-desc" rows="3" placeholder="Task details..." class="w-full bg-surface-container-highest/50 border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface text-sm focus:ring-1 focus:ring-primary placeholder-on-surface-variant/40 resize-none"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Status</label>
          <select id="task-status" class="w-full bg-surface-container-highest/50 border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface text-sm focus:ring-1 focus:ring-primary">
            <option value="todo">To Do</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Done</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Priority</label>
          <select id="task-priority" class="w-full bg-surface-container-highest/50 border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface text-sm focus:ring-1 focus:ring-primary">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Due Date *</label>
          <input id="task-due" type="date" required class="w-full bg-surface-container-highest/50 border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface text-sm focus:ring-1 focus:ring-primary"/>
        </div>
        <div>
          <label class="text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1 block">Revenue ($)</label>
          <input id="task-revenue" type="number" min="1" placeholder="40000" class="w-full bg-surface-container-highest/50 border border-outline-variant/20 rounded-lg px-4 py-3 text-on-surface text-sm focus:ring-1 focus:ring-primary placeholder-on-surface-variant/40"/>
        </div>
      </div>
      <div class="flex justify-end gap-3 pt-4">
        <button type="button" id="delete-task-btn" class="hidden px-5 py-2.5 rounded-lg text-error border border-error/30 hover:bg-error/10 text-sm font-bold transition-colors">
          Delete
        </button>
        <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-lg font-bold text-sm shadow-md transition-all active:scale-95">
          <span id="modal-submit-text">Create Task</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast fixed bottom-6 right-6 z-[200] px-5 py-3 bg-surface-container-high rounded-xl text-on-surface text-sm font-medium shadow-2xl opacity-0 pointer-events-none border border-outline-variant/20"></div>

<script>
  const API = '/api';
  const token = localStorage.getItem('pm_token');
  const user = JSON.parse(localStorage.getItem('pm_user') || 'null');

  // Auth guard
  if (!token) { window.location.href = '/login.html'; }

  // Populate user info
  if (user) {
    document.getElementById('user-name').textContent = user.name || user.email;
    document.getElementById('user-avatar').textContent = (user.name || user.email || '?')[0].toUpperCase();
  }

  // Logout
  document.getElementById('logout-btn').addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('pm_token');
    localStorage.removeItem('pm_user');
    window.location.href = '/login.html';
  });

  // Authorized fetch
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers || {}) }
    });
    if (res.status === 401) { localStorage.removeItem('pm_token'); window.location.href = '/login.html'; }
    return res.json();
  }

  // Toast
  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.pointerEvents = 'auto';
    t.style.borderColor = isError ? 'rgba(255,180,171,0.3)' : 'rgba(78,222,163,0.3)';
    setTimeout(() => { t.style.opacity = '0'; t.style.pointerEvents = 'none'; }, 3000);
  }

  // --- Dashboard ---
  async function loadDashboard() {
    const data = await apiFetch(`${API}/dashboard`);
    if (!data.success) return;
    const d = data.data;
    document.getElementById('total-revenue').textContent = '$' + (d.totalRevenue || 0).toLocaleString();
    document.getElementById('due-soon-count').textContent = d.dueSoon || 0;
    document.getElementById('stat-todo').textContent = d.todo || 0;
    document.getElementById('stat-inprog').textContent = d.inProgress || 0;
    document.getElementById('stat-done').textContent = d.completed || 0;
  }

  // --- Tasks ---
  let allTasks = [];
  let activeFilter = '';
  let searchQuery = '';

  async function loadTasks() {
    const data = await apiFetch(`${API}/tasks`);
    if (!data.success) { showToast('Failed to load tasks', true); return; }
    allTasks = data.data;
    renderTasks();
  }

  function buildCard(task) {
    const priorityConfig = {
      high: { bg: 'bg-error/10', text: 'text-error', label: 'High' },
      medium: { bg: 'bg-primary/10', text: 'text-primary', label: 'Medium' },
      low: { bg: 'bg-surface-container-highest', text: 'text-on-surface-variant', label: 'Low' }
    };
    const p = priorityConfig[task.priority] || priorityConfig.medium;
    const isCompleted = task.status === 'completed';

    const card = document.createElement('div');
    card.className = `task-card glass-panel p-5 rounded-xl border border-outline-variant/10 shadow-lg hover:border-primary/30 transition-all cursor-grab active:cursor-grabbing ${isCompleted ? 'opacity-60 grayscale-[0.4]' : ''}`;
    card.draggable = true;
    card.dataset.id = task.id;

    card.innerHTML = `
      <div class="flex justify-between items-start mb-3">
        <span class="${p.bg} ${p.text} text-[10px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wider">${p.label}</span>
        <button class="edit-btn text-on-surface-variant hover:text-primary text-lg transition-colors" data-id="${task.id}">
          <span class="material-symbols-outlined text-lg">${isCompleted ? 'check_circle' : 'more_horiz'}</span>
        </button>
      </div>
      <h4 class="text-on-surface font-bold text-base mb-1 leading-tight ${isCompleted ? 'line-through' : ''}">${escHtml(task.title)}</h4>
      ${task.description ? `<p class="text-on-surface-variant text-xs mb-4 line-clamp-2">${escHtml(task.description)}</p>` : ''}
      <div class="flex justify-between items-center mt-4">
        <span class="text-tertiary font-black text-sm">$${(task.revenue || 0).toLocaleString()}</span>
        <div class="flex items-center gap-1 text-on-surface-variant">
          <span class="material-symbols-outlined text-sm">schedule</span>
          <span class="text-[10px] font-bold uppercase tracking-tighter">${task.dueDate || '—'}</span>
        </div>
      </div>
    `;

    // Drag
    card.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', task.id);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));

    // Edit click
    card.querySelector('.edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      openModal(task);
    });

    return card;
  }

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function renderTasks() {
    const containers = {
      todo: document.getElementById('tasks-todo'),
      in_progress: document.getElementById('tasks-inprogress'),
      completed: document.getElementById('tasks-done')
    };
    Object.values(containers).forEach(c => c.innerHTML = '');

    const filtered = allTasks.filter(t => {
      if (activeFilter && t.priority !== activeFilter) return false;
      if (searchQuery && !t.title.toLowerCase().includes(searchQuery)) return false;
      return true;
    });

    const counts = { todo: 0, in_progress: 0, completed: 0 };
    filtered.forEach(task => {
      const col = containers[task.status];
      if (!col) return;
      col.appendChild(buildCard(task));
      counts[task.status] = (counts[task.status] || 0) + 1;
    });

    document.getElementById('count-todo').textContent = counts.todo;
    document.getElementById('count-inprogress').textContent = counts.in_progress;
    document.getElementById('count-done').textContent = counts.completed;
  }

  // Drag & Drop on columns
  document.querySelectorAll('.kanban-column').forEach(col => {
    const inner = col.querySelector('[id^="tasks-"]');
    inner.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    inner.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    inner.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const taskId = parseInt(e.dataTransfer.getData('text/plain'));
      const newStatus = col.closest('.kanban-column').dataset.status;
      const task = allTasks.find(t => t.id === taskId);
      if (!task || task.status === newStatus) return;

      // Optimistic update
      task.status = newStatus;
      renderTasks();

      const res = await apiFetch(`${API}/tasks/update-status`, {
        method: 'PUT',
        body: JSON.stringify({ id: taskId, status: newStatus })
      });
      if (res.success) {
        showToast('Task moved!');
        loadDashboard();
      } else {
        showToast('Failed to update task.', true);
        loadTasks();
      }
    });
  });

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('ring-1', 'ring-primary'));
      btn.classList.add('ring-1', 'ring-primary');
      renderTasks();
    });
  });

  // Search
  document.getElementById('search-input').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase();
    renderTasks();
  });

  // --- Modal ---
  let editingTaskId = null;

  function openModal(task = null) {
    editingTaskId = task ? task.id : null;
    document.getElementById('modal-title').textContent = task ? 'Edit Task' : 'New Task';
    document.getElementById('modal-submit-text').textContent = task ? 'Save Changes' : 'Create Task';
    document.getElementById('task-id').value = task ? task.id : '';
    document.getElementById('task-title').value = task ? task.title : '';
    document.getElementById('task-desc').value = task ? (task.description || '') : '';
    document.getElementById('task-status').value = task ? task.status : 'todo';
    document.getElementById('task-priority').value = task ? task.priority : 'medium';
    document.getElementById('task-due').value = task ? task.dueDate : '';
    document.getElementById('task-revenue').value = task ? task.revenue : '';
    document.getElementById('delete-task-btn').classList.toggle('hidden', !task);
    document.getElementById('task-modal').classList.add('open');
  }

  document.getElementById('close-modal').addEventListener('click', () => document.getElementById('task-modal').classList.remove('open'));
  document.getElementById('task-modal').addEventListener('click', (e) => { if (e.target === document.getElementById('task-modal')) document.getElementById('task-modal').classList.remove('open'); });
  document.getElementById('new-task-btn').addEventListener('click', () => openModal());
  document.getElementById('open-create-btn').addEventListener('click', () => openModal());

  // Submit (create or update)
  document.getElementById('task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      title: document.getElementById('task-title').value,
      description: document.getElementById('task-desc').value,
      status: document.getElementById('task-status').value,
      priority: document.getElementById('task-priority').value,
      dueDate: document.getElementById('task-due').value,
      revenue: parseInt(document.getElementById('task-revenue').value) || null
    };

    let res;
    if (editingTaskId) {
      res = await apiFetch(`${API}/tasks/${editingTaskId}`, { method: 'PUT', body: JSON.stringify(payload) });
    } else {
      res = await apiFetch(`${API}/tasks`, { method: 'POST', body: JSON.stringify(payload) });
    }

    if (res.success) {
      document.getElementById('task-modal').classList.remove('open');
      showToast(editingTaskId ? 'Task updated!' : 'Task created!');
      loadTasks();
      loadDashboard();
    } else {
      showToast(res.message || 'Operation failed.', true);
    }
  });

  // Delete
  document.getElementById('delete-task-btn').addEventListener('click', async () => {
    if (!editingTaskId || !confirm('Delete this task?')) return;
    const res = await apiFetch(`${API}/tasks/${editingTaskId}`, { method: 'DELETE' });
    if (res.success) {
      document.getElementById('task-modal').classList.remove('open');
      showToast('Task deleted.');
      loadTasks();
      loadDashboard();
    } else {
      showToast('Failed to delete.', true);
    }
  });

  // Set default due date to tomorrow
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('task-due').min = tomorrow.toISOString().split('T')[0];

  // Init
  loadDashboard();
  loadTasks();
</script>
</body></html>
